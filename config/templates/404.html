<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>404</title>

<style>
:root {
  --bg: #020617;
  --neon: #22d3ee;
  --accent: #38bdf8;
  --text: #e5e7eb;
  --muted: #64748b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background:
    radial-gradient(1200px at 15% 20%, rgba(34,211,238,.15), transparent 40%),
    radial-gradient(1200px at 85% 80%, rgba(56,189,248,.12), transparent 45%),
    #020617;
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.container {
  text-align: center;
  max-width: 620px;
  padding: 40px;
  animation: appear 1.2s ease-out forwards;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.code {
  font-size: 140px;
  font-weight: 900;
  letter-spacing: -8px;
  line-height: 1;
  background: linear-gradient(90deg, var(--neon), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: glow 3s ease-in-out infinite;
}

@keyframes glow {
  0%, 100% { filter: drop-shadow(0 0 12px rgba(34,211,238,.35)); }
  50% { filter: drop-shadow(0 0 36px rgba(34,211,238,.65)); }
}

h1 {
  margin: 16px 0 8px;
  font-size: 28px;
  font-weight: 600;
}

p {
  margin: 0;
  font-size: 16px;
  color: var(--muted);
}

.meme {
  margin-top: 28px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 15px;
  color: #94a3b8;
  opacity: 0.9;
  animation: blink 2.8s infinite;
}

@keyframes blink {
  0%, 100% { opacity: .9; }
  50% { opacity: .4; }
}

.footer {
  margin-top: 36px;
  font-size: 12px;
  color: #475569;
  letter-spacing: .04em;
}
</style>
</head>

<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Ресурс не найден</h1>
    <p>
      Мы проверили маршруты, таблицы и реальность —  
      этого адреса здесь не существует.
    </p>

    <div class="meme">
      status: calm<br>
      situation: not found<br>
      conclusion: this is fine
    </div>

    <div class="footer">
      MindTech API · production mode
    </div>
  </div>
</body>
</html>
